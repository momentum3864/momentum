<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOMENTUM · 관리자</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-admin">

  <header class="admin-top">
    <div>
      <p class="eyebrow">MOMENTUM</p>
      <h1>관리자</h1>
    </div>

    <nav class="admin-nav">
      <a href="/" target="_blank">하객 페이지 ↗</a>
      <a href="/display" target="_blank">디스플레이 열기 ↗</a>
    </nav>
  </header>

  <main class="admin">

    <!-- 통계 -->
    <section class="stats">
      <div class="stat">
        <span class="stat-num" id="stat-messages">–</span>
        <span class="stat-label">메시지</span>
      </div>

      <div class="stat">
        <span class="stat-num" id="stat-artworks">–</span>
        <span class="stat-label">완성된 작품</span>
      </div>

      <div class="stat">
        <span class="stat-num" id="stat-triggers">–</span>
        <span class="stat-label">버튼 실행</span>
      </div>
    </section>

    <!-- 웹 축하 실행 -->
    <section class="panel trigger-panel">
      <div>
        <h2>작품 실행</h2>
        <p class="muted">
          디스플레이 화면이 켜져 있어야 애니메이션이 시작됩니다.
        </p>
      </div>

      <button id="web-trigger" class="btn btn-primary btn-lg">
        지금 실행하기
      </button>

      <p id="trigger-result" class="trigger-result" aria-live="polite"></p>
    </section>

    <!-- 축하 메시지 목록 -->
    <section class="panel">
      <div class="panel-head">
        <h2>축하 메시지</h2>
        <button class="btn btn-ghost btn-sm" data-refresh>
          새로고침
        </button>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>#</th>
              <th>이름</th>
              <th>메시지</th>
              <th>작성 시간</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="message-rows">
            <tr>
              <td colspan="5" class="empty">불러오는 중…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <div class="admin-grid">

      <!-- 작품 목록 -->
      <section class="panel">
        <h2>완성된 작품</h2>
        <ul id="artwork-list" class="artwork-list">
          <li class="empty">불러오는 중…</li>
        </ul>
      </section>

      <!-- 실행 기록 -->
      <section class="panel">
        <h2>버튼 실행 기록</h2>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>#</th>
                <th>버튼</th>
                <th>상태</th>
                <th>작품</th>
                <th>시간</th>
              </tr>
            </thead>

            <tbody id="trigger-rows">
              <tr>
                <td colspan="5" class="empty">불러오는 중…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <script>
    window.DISPLAY_URL = "/display";
  </script>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>

  <script>
    MOMENTUM.initAdminPage();
  </script>
</body>
</html>
